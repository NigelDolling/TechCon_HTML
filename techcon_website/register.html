<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for TechCon 2024</title>
</head>
<body>
    <header>
    <h1> Register for TechCon 2024</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#index.html">Home</a></li>
            <li><a href="#about.html">About</a></li>
            <li><a href="#schedule.html">Schedule</a></li>
            <li><a href="#register.html">Register</a></li>
        </ul>
    </nav>
    <main>
        <form action="/register" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <label for="check-box">I agree to the terms and conditions</label>
            <input type="checkbox" id="check-box" name="check-box" required>
            <button type="submit">Register Now</button>

        </form>
    </main>
    <footer>
        <p>copyright &copy; 2024 TechCon. All rights reserved.</p>
    </footer>
</body>
</html>
